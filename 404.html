<!DOCTYPE html>
<html lang="en-NG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Antoinette Gardens and Guest House Services</title>
  <link rel="icon" type="image/svg+xml" href="assets/svg/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .not-found-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }
    .not-found-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 700;
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .not-found-title {
      font-size: clamp(1.8rem, 4vw, 2.75rem);
      margin-bottom: 1rem;
    }
    .not-found-desc {
      max-width: 480px;
      margin-bottom: 2.5rem;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-inner" style="display: flex; justify-content: center; min-height: 80px;">
        <a href="index.html">
          <img src="assets/svg/logo-placeholder.svg" alt="Antoinette Gardens" class="brand-logo-img" width="220" height="44">
        </a>
      </div>
    </div>
  </header>

  <main class="not-found-wrap">
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">Lost in the Garden?</h1>
    <p class="not-found-desc">
      The page you are looking for has been moved or does not exist. Let us guide you back to our delicious meals and serene garden tables.
    </p>
    <a href="index.html" class="btn btn-primary">Return to Homepage</a>
  </main>

  <footer class="site-footer" style="padding-top: 3rem; padding-bottom: 2rem;">
    <div class="container" style="text-align: center; color: rgba(250, 247, 242, 0.6); font-size: 0.875rem;">
      &copy; 2026 Antoinette Gardens and Guest House Services. Plot 151/160 Ordinance Road, Trans Amadi, Port Harcourt.
    </div>
  </footer>

</html>
